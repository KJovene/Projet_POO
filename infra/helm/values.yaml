# Overlay COMMUN à tous les environnements (branché en premier avec -f).
# Réglages spécifiques à un environnement : voir values-dev/prod.yaml.
image:
  repository: locatic
  tag: "local"
  pullPolicy: IfNotPresent

service:
  # ClusterIP : l'application n'est plus exposée directement, Nginx est le point d'entrée.
  type: ClusterIP
  port: 8080

postgresql:
  enabled: false

secret:
  enabled: false

persistence:
  enabled: true
  mountPath: /app/data
