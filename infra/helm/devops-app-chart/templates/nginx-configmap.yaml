apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.fullname" . }}-nginx-config
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;

      location / {
        proxy_pass http://{{ include "devops-app.fullname" . }}-svc:{{ .Values.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
      }
    }
