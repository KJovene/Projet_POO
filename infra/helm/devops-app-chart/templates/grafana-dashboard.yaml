{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-app.fullname" . }}-grafana-dashboard
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  locatic-overview.json: |
    {
      "title": "Locatic Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))",
              "legendFormat": "requests/s"
            }
          ]
        },
        {
          "title": "HTTP Duration P95",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "title": "Nginx Requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(nginx_http_requests_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))",
              "legendFormat": "nginx req/s"
            }
          ]
        },
        {
          "title": "Nginx Active Connections",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(nginx_connections_active{namespace=\"{{ .Release.Namespace }}\"})"
            }
          ]
        },
        {
          "title": "Pods Not Ready",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 8 },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"{{ .Release.Namespace }}\", condition=\"true\"} == 0)"
            }
          ]
        },
        {
          "title": "SQLite PVC Usage %",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=\"{{ .Release.Namespace }}\", persistentvolumeclaim=\"{{ .Values.persistence.existingClaim }}\"} / kubelet_volume_stats_capacity_bytes{namespace=\"{{ .Release.Namespace }}\", persistentvolumeclaim=\"{{ .Values.persistence.existingClaim }}\"}"
            }
          ]
        },
        {
          "title": "Kubernetes Services Up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(kube_endpoint_address_available{namespace=\"{{ .Release.Namespace }}\"})"
            }
          ]
        }
      ]
    }
{{- end }}