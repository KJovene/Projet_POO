global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques d'infrastructure (CPU, mémoire, disque) de la machine hôte.
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
